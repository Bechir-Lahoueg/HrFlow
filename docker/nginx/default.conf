server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    # Taille max des uploads (CVs, images)
    client_max_body_size 20M;

    # Fichiers statiques servis directement par Nginx
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|map)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Toutes les requêtes passent par index.php (front controller Symfony)
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Nécessaire pour Symfony
        fastcgi_param APP_ENV $http_app_env;
        internal;
    }

    # Bloquer l'accès aux autres fichiers .php
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
