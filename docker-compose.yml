services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hrflow_php
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - hrflow

  nginx:
    image: nginx:1.25-alpine
    container_name: hrflow_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped
    networks:
      - hrflow

networks:
  hrflow:
    driver: bridge
